name: Feature request
description: Something the Amiga Utilities should do (a tool, a change, or a new utility)
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What you would like
      description: What you want to do, and how you would expect it to work.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What it would let you do that you can't now.
