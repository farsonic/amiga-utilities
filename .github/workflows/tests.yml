# Host tests of WBFit and FitView (ASan/UBSan, Python reference checks). The Amiga build needs vbcc and
# the NDK, which are not installed here; see CLAUDE.md.
name: tests
on:
  push:
  pull_request:
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python packages for the reference checks
        run: pip install pillow numpy
      - name: Host tests
        run: make test
